name: CI/CD Pipeline - LPiGreen

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_REGISTRY: donavanalencar
  K8S_NAMESPACE: lpigreen

jobs:
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint || echo "⚠️ Lint não configurado, pulando..."
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck || echo "⚠️ Typecheck pulando..."
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      web_image: ${{ steps.tags.outputs.web_image }}
      api_image: ${{ steps.tags.outputs.api_image }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar secrets do Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ Secret DOCKERHUB_USERNAME não configurado neste repositório."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "❌ Secret DOCKERHUB_TOKEN não configurado neste repositório."
            exit 1
          fi
          echo "✅ Secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN configurados."

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags Docker por ambiente
        id: tags
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "web_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-web:latest
          ${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-api:latest
          ${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "web_image=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_image=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "web_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-web:develop
          ${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-api:develop
          ${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "web_image=${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_image=${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build e Push imagem (frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web_tags }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
          cache-to: type=inline

      - name: Build e Push imagem (backend API)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.ref == 'refs/heads/main' && 'latest' || 'develop' }}
          cache-to: type=inline

  # ─── PRODUÇÃO (main) ──────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy - Produção
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "⚠️ Secret KUBECONFIG não configurado. Configure em Settings > Secrets > Actions"
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info || { echo "⚠️ Erro ao conectar ao cluster."; exit 1; }

      - name: Aplicar Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: ConfigMap mysql-init
        run: |
          kubectl create configmap mysql-init -n ${{ env.K8S_NAMESPACE }} \
            --from-file=init.sql=infra/mysql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MySQL
        run: |
          kubectl apply -f infra/k8s/mysql-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mysql -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Job criar usuário MySQL (idempotente)
        run: |
          kubectl delete job mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f infra/k8s/mysql-create-user-job.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

      - name: Secret doc-ai
        run: |
          kubectl create secret generic doc-ai-secret -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=DOC_AI_PROVIDER="${{ secrets.DOC_AI_PROVIDER || '' }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY || '' }}" \
            --from-literal=OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}" \
            --from-literal=DOC_AI_TIMEOUT_MS="${{ secrets.DOC_AI_TIMEOUT_MS || '8000' }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY || '' }}" \
            --from-literal=DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}" \
            --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -

      - name: Deploy Redis
        run: |
          kubectl apply -f infra/k8s/redis-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/redis -n ${{ env.K8S_NAMESPACE }} --timeout=180s || true

      - name: Deploy API (backend)
        run: |
          kubectl apply -f infra/k8s/api-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-api \
            api=${{ needs.build.outputs.api_image }} \
            -n ${{ env.K8S_NAMESPACE }}
          if ! kubectl rollout status deployment/lpigreen-api -n ${{ env.K8S_NAMESPACE }} --timeout=300s; then
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o wide
            for POD in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o jsonpath='{.items[*].metadata.name}'); do
              kubectl logs "$POD" -n ${{ env.K8S_NAMESPACE }} --tail=80 || true
            done
            exit 1
          fi

      - name: Secret CRM Admin
        run: |
          if [ -n "${{ secrets.ADMIN_USER }}" ] && [ -n "${{ secrets.ADMIN_PASSWORD }}" ] && [ -n "${{ secrets.ADMIN_JWT_SECRET }}" ]; then
            kubectl create secret generic admin-secret -n ${{ env.K8S_NAMESPACE }} \
              --from-literal=admin-user="${{ secrets.ADMIN_USER }}" \
              --from-literal=admin-password="${{ secrets.ADMIN_PASSWORD }}" \
              --from-literal=admin-jwt-secret="${{ secrets.ADMIN_JWT_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -
          else
            kubectl apply -f infra/k8s/admin-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Deploy Frontend
        run: |
          kubectl apply -f infra/k8s/deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-web \
            web=${{ needs.build.outputs.web_image }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Aplicar Middlewares e IngressRoute
        run: |
          if [ -d "infra/k8s/middlewares" ]; then
            kubectl apply -f infra/k8s/middlewares/ -n ${{ env.K8S_NAMESPACE }}
          fi
          kubectl apply -f infra/k8s/ingress-route.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Status final
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo "=== IngressRoutes ==="
          kubectl get ingressroute -n ${{ env.K8S_NAMESPACE }}

  # ─── DESENVOLVIMENTO (develop) ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy - Desenvolvimento
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p $HOME/.kube
          KUBECONFIG_SECRET="${{ secrets.KUBECONFIG_DEV || secrets.KUBECONFIG }}"
          if [ -z "$KUBECONFIG_SECRET" ]; then
            echo "⚠️ Configure KUBECONFIG_DEV (ou KUBECONFIG) em Settings > Secrets > Actions"
            exit 1
          fi
          echo "$KUBECONFIG_SECRET" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info || { echo "⚠️ Erro ao conectar ao cluster."; exit 1; }

      - name: Aplicar Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: ConfigMap mysql-init
        run: |
          kubectl create configmap mysql-init -n ${{ env.K8S_NAMESPACE }} \
            --from-file=init.sql=infra/mysql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MySQL
        run: |
          kubectl apply -f infra/k8s/mysql-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mysql -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Job criar usuário MySQL (idempotente)
        run: |
          kubectl delete job mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f infra/k8s/mysql-create-user-job.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

      - name: Migrações do banco de dados
        run: |
          for JOB in infra/k8s/mysql-*-migration-job.yaml; do
            JOB_NAME=$(grep "^  name:" "$JOB" | head -1 | awk '{print $2}')
            kubectl delete job "$JOB_NAME" -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
            kubectl apply -f "$JOB" -n ${{ env.K8S_NAMESPACE }}
            kubectl wait --for=condition=complete job/"$JOB_NAME" -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true
          done

      - name: Secret doc-ai
        run: |
          kubectl create secret generic doc-ai-secret -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=DOC_AI_PROVIDER="${{ secrets.DOC_AI_PROVIDER || '' }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY || '' }}" \
            --from-literal=OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}" \
            --from-literal=DOC_AI_TIMEOUT_MS="${{ secrets.DOC_AI_TIMEOUT_MS || '8000' }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY || '' }}" \
            --from-literal=DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}" \
            --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -

      - name: Deploy Redis
        run: |
          kubectl apply -f infra/k8s/redis-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/redis -n ${{ env.K8S_NAMESPACE }} --timeout=180s || true

      - name: Deploy API (backend)
        run: |
          kubectl apply -f infra/k8s/api-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-api \
            api=${{ needs.build.outputs.api_image }} \
            -n ${{ env.K8S_NAMESPACE }}
          if ! kubectl rollout status deployment/lpigreen-api -n ${{ env.K8S_NAMESPACE }} --timeout=300s; then
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o wide
            for POD in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o jsonpath='{.items[*].metadata.name}'); do
              kubectl logs "$POD" -n ${{ env.K8S_NAMESPACE }} --tail=80 || true
            done
            exit 1
          fi

      - name: Secret CRM Admin
        run: |
          ADMIN_USER="${{ secrets.ADMIN_USER_DEV || secrets.ADMIN_USER }}"
          ADMIN_PASS="${{ secrets.ADMIN_PASSWORD_DEV || secrets.ADMIN_PASSWORD }}"
          ADMIN_JWT="${{ secrets.ADMIN_JWT_SECRET_DEV || secrets.ADMIN_JWT_SECRET }}"
          if [ -n "$ADMIN_USER" ] && [ -n "$ADMIN_PASS" ] && [ -n "$ADMIN_JWT" ]; then
            kubectl create secret generic admin-secret -n ${{ env.K8S_NAMESPACE }} \
              --from-literal=admin-user="$ADMIN_USER" \
              --from-literal=admin-password="$ADMIN_PASS" \
              --from-literal=admin-jwt-secret="$ADMIN_JWT" \
              --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -
          else
            kubectl apply -f infra/k8s/admin-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Deploy Frontend
        run: |
          kubectl apply -f infra/k8s/deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-web \
            web=${{ needs.build.outputs.web_image }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Aplicar Middlewares e IngressRoute
        run: |
          if [ -d "infra/k8s/middlewares" ]; then
            kubectl apply -f infra/k8s/middlewares/ -n ${{ env.K8S_NAMESPACE }}
          fi
          kubectl apply -f infra/k8s/ingress-route.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Status final
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo "=== IngressRoutes ==="
          kubectl get ingressroute -n ${{ env.K8S_NAMESPACE }}
