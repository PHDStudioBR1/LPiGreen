name: CI/CD Pipeline - LPiGreen

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_REGISTRY: donavanalencar
  K8S_NAMESPACE: lpigreen

jobs:
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint || echo "⚠️ Lint não configurado, pulando..."
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck || echo "⚠️ Typecheck pulando..."
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar secrets do Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ Secret DOCKERHUB_USERNAME não configurado neste repositório."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "❌ Secret DOCKERHUB_TOKEN não configurado neste repositório."
            exit 1
          fi
          echo "✅ Secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN configurados."

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags Docker por ambiente
        id: tags
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "web_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-web:latest,${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }},${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-api:latest,${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }},${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "web_image=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "web_image_dev=${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_image=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_image_dev=${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "web_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-web:develop,${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_tags=${{ env.DOCKER_REGISTRY }}/lpigreen-api:develop,${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "web_image=${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "web_image_dev=${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_image=${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "api_image_dev=${{ env.DOCKER_REGISTRY }}/lpigreen-api:dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Definir build args do frontend
        id: web_build_args
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "phdcrm_env=prod" >> $GITHUB_OUTPUT
          else
            echo "phdcrm_env=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build e Push imagem (frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web_tags }}
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_PHDCRM_ENV=${{ steps.web_build_args.outputs.phdcrm_env }}

      - name: Build e Push imagem (backend API)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          cache-to: type=inline

  # ─── PRODUÇÃO (main) ──────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy - Produção
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "⚠️ Secret KUBECONFIG não configurado. Configure em Settings > Secrets > Actions"
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info || { echo "⚠️ Erro ao conectar ao cluster."; exit 1; }

      - name: Aplicar Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: ConfigMap mysql-init
        run: |
          kubectl create configmap mysql-init -n ${{ env.K8S_NAMESPACE }} \
            --from-file=init.sql=infra/mysql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MySQL
        run: |
          kubectl apply -f infra/k8s/mysql-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mysql -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Job criar usuário MySQL (idempotente)
        run: |
          kubectl delete job mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f infra/k8s/mysql-create-user-job.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

      - name: Secret doc-ai
        run: |
          kubectl create secret generic doc-ai-secret -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=DOC_AI_PROVIDER="${{ secrets.DOC_AI_PROVIDER || '' }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY || '' }}" \
            --from-literal=OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}" \
            --from-literal=DOC_AI_TIMEOUT_MS="${{ secrets.DOC_AI_TIMEOUT_MS || '8000' }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY || '' }}" \
            --from-literal=DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}" \
            --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -

      - name: Deploy Redis
        run: |
          kubectl apply -f infra/k8s/redis-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/redis -n ${{ env.K8S_NAMESPACE }} --timeout=180s || true

      - name: Deploy API (backend)
        run: |
          kubectl apply -f infra/k8s/api-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-api \
            api=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          if ! kubectl rollout status deployment/lpigreen-api -n ${{ env.K8S_NAMESPACE }} --timeout=300s; then
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o wide
            for POD in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o jsonpath='{.items[*].metadata.name}'); do
              kubectl logs "$POD" -n ${{ env.K8S_NAMESPACE }} --tail=80 || true
            done
            exit 1
          fi

      - name: Secret CRM Admin
        run: |
          if [ -n "${{ secrets.ADMIN_USER }}" ] && [ -n "${{ secrets.ADMIN_PASSWORD }}" ] && [ -n "${{ secrets.ADMIN_JWT_SECRET }}" ]; then
            kubectl create secret generic admin-secret -n ${{ env.K8S_NAMESPACE }} \
              --from-literal=admin-user="${{ secrets.ADMIN_USER }}" \
              --from-literal=admin-password="${{ secrets.ADMIN_PASSWORD }}" \
              --from-literal=admin-jwt-secret="${{ secrets.ADMIN_JWT_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -
          else
            kubectl apply -f infra/k8s/admin-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Deploy Frontend
        run: |
          kubectl apply -f infra/k8s/deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/network-policy-allow-lpigreen-to-random-service-prod.yaml
          kubectl set image deployment/lpigreen-web \
            web=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl set env deployment/lpigreen-web \
            LEAD_API_URL=http://api-service.phdstudio.svc.cluster.local \
            RANDOM_SERVICE_URL=http://random-service-api.phdstudio.svc.cluster.local:3000 \
            PHDCRM_ENV=prod \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Aplicar Middlewares e IngressRoute
        run: |
          if [ -d "infra/k8s/middlewares" ]; then
            kubectl apply -f infra/k8s/middlewares/ -n ${{ env.K8S_NAMESPACE }}
          fi
          kubectl apply -f infra/k8s/ingress-route.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/ingress-route-dev-prod-cluster.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Verificar rotas públicas (prod)
        run: bash scripts/verify-public-routes.sh https://lpigreen.546digitalservices.com

      - name: Status final
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo "=== IngressRoutes ==="
          kubectl get ingressroute -n ${{ env.K8S_NAMESPACE }}

  # ─── DESENVOLVIMENTO (develop) ─────────────────────────────────────────────

  deploy-dev:
    name: Deploy - Desenvolvimento
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    environment: development
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Definir imagem do frontend dev
        id: dev_image
        run: |
          echo "web_image=${{ env.DOCKER_REGISTRY }}/lpigreen-web:dev-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Detectar clusters dev/prod
        id: clusters
        run: |
          same_cluster=false
          if [ -n "${{ secrets.KUBECONFIG_DEV }}" ] && [ -n "${{ secrets.KUBECONFIG }}" ]; then
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > /tmp/prod-kubeconfig
            echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > /tmp/dev-kubeconfig
            prod_cluster="$(KUBECONFIG=/tmp/prod-kubeconfig kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')"
            dev_cluster="$(KUBECONFIG=/tmp/dev-kubeconfig kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')"
            echo "Cluster prod: ${prod_cluster}"
            echo "Cluster legado: ${dev_cluster}"
            if [ "${prod_cluster}" = "${dev_cluster}" ]; then
              same_cluster=true
            fi
          fi
          echo "same_cluster=${same_cluster}" >> $GITHUB_OUTPUT

      - name: Deploy Frontend — cluster DEV legado (KUBECONFIG_DEV)
        run: |
          if [ -z "${{ secrets.KUBECONFIG_DEV }}" ]; then
            echo "⚠️ KUBECONFIG_DEV não configurado — pulando deploy no cluster legado."
            exit 0
          fi
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

          kubectl apply -f infra/k8s/deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/network-policy-allow-lpigreen-to-random-service-dev.yaml
          kubectl set image deployment/lpigreen-web \
            web=${{ steps.dev_image.outputs.web_image }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl set env deployment/lpigreen-web \
            LEAD_API_URL=http://api-dev-service.phdcrm-dev.svc.cluster.local \
            RANDOM_SERVICE_URL=http://random-service-api.phdcrm-dev.svc.cluster.local:3000 \
            PHDCRM_ENV=dev \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s

          if [ -d "infra/k8s/middlewares" ]; then
            kubectl apply -f infra/k8s/middlewares/ -n ${{ env.K8S_NAMESPACE }}
          fi
          if [ "${{ steps.clusters.outputs.same_cluster }}" != "true" ]; then
            kubectl apply -f infra/k8s/ingress-route-dev.yaml -n ${{ env.K8S_NAMESPACE }}
            echo "Ingress legado aplicado (clusters distintos)."
          else
            echo "⚠️ Mesmo cluster que prod — mantendo ingress lpigreen-web-dev (web-dev-service)."
          fi
          echo "Cluster legado — imagem:"
          kubectl get deployment lpigreen-web -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

      - name: Deploy Frontend — cluster PROD (lpigreen-web-dev)
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "❌ KUBECONFIG não configurado — lpigreendev depende de lpigreen-web-dev neste cluster."
            exit 1
          fi
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info
          bash scripts/k8s-rollout-frontend-dev.sh ${{ env.K8S_NAMESPACE }} "${{ steps.dev_image.outputs.web_image }}" || {
            echo "=== Diagnóstico lpigreen-web-dev ==="
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-web-dev -o wide || true
            kubectl describe deployment lpigreen-web-dev -n ${{ env.K8S_NAMESPACE }} || true
            for POD in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-web-dev -o jsonpath='{.items[*].metadata.name}'); do
              kubectl logs "$POD" -n ${{ env.K8S_NAMESPACE }} --tail=80 || true
            done
            exit 1
          }

      - name: Verificar rotas públicas (dev)
        env:
          VERIFY_ROUTES_INITIAL_WAIT: 45
        run: bash scripts/verify-public-routes.sh https://lpigreendev.546digitalservices.com

      - name: Status final
        run: |
          echo "Deploy dev concluído. Imagem: ${{ steps.dev_image.outputs.web_image }}"
          echo "=== Pods (cluster prod / web-dev) ==="
          if [ -n "${{ secrets.KUBECONFIG }}" ]; then
            mkdir -p $HOME/.kube
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
            chmod 600 $HOME/.kube/config
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-web-dev
          fi
