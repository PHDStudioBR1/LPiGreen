name: CI/CD Pipeline - LPiGreen

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_REGISTRY: donavanalencar
  K8S_NAMESPACE: lpigreen

jobs:
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint || echo "⚠️ Lint não configurado, pulando..."
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck || echo "⚠️ Typecheck pulando..."
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push imagem (frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/lpigreen-web:latest
            ${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/lpigreen-web:latest
          cache-to: type=inline

      - name: Build e Push imagem (backend API)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/lpigreen-api:latest
            ${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/lpigreen-api:latest
          cache-to: type=inline

  deploy:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "⚠️ Secret KUBECONFIG não configurado. Configure em Settings > Secrets > Actions"
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info || { echo "⚠️ Erro ao conectar ao cluster."; exit 1; }

      - name: Aplicar Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: ConfigMap mysql-init (script de criação do banco)
        run: |
          kubectl create configmap mysql-init -n ${{ env.K8S_NAMESPACE }} \
            --from-file=init.sql=infra/mysql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MySQL (secret, config, pvc, deployment)
        run: |
          kubectl apply -f infra/k8s/mysql-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mysql -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Job criar usuário MySQL (idempotente)
        run: |
          kubectl delete job mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f infra/k8s/mysql-create-user-job.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

      - name: Deploy API (backend)
        run: |
          kubectl apply -f infra/k8s/api-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-api \
            api=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-api -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Deploy aplicação (frontend)
        run: |
          kubectl apply -f infra/k8s/deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-web \
            web=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Aplicar Middlewares
        run: |
          if [ -d "infra/k8s/middlewares" ]; then
            kubectl apply -f infra/k8s/middlewares/ -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Aplicar Certificate e Ingress
        run: |
          kubectl apply -f infra/k8s/certificate.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/ingress-route.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Status final
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== IngressRoutes ==="
          kubectl get ingressroute -n ${{ env.K8S_NAMESPACE }}
