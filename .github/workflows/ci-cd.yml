name: CI/CD Pipeline - LPiGreen

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_REGISTRY: donavanalencar
  K8S_NAMESPACE: lpigreen

jobs:
  validate:
    name: Validar Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint || echo "⚠️ Lint não configurado, pulando..."
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck || echo "⚠️ Typecheck pulando..."
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar secrets do Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ Secret DOCKERHUB_USERNAME não configurado neste repositório."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "❌ Secret DOCKERHUB_TOKEN não configurado neste repositório."
            exit 1
          fi
          echo "✅ Secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN estão configurados (valores não são exibidos nos logs)."

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push imagem (frontend)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/lpigreen-web:latest
            ${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/lpigreen-web:latest
          cache-to: type=inline

      - name: Build e Push imagem (backend API)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/lpigreen-api:latest
            ${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/lpigreen-api:latest
          cache-to: type=inline

  deploy-dev:
    name: Deploy no Kubernetes (DEV)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    env:
      K8S_NAMESPACE: lpigreendev
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar acesso ao cluster (DEV)
        run: |
          mkdir -p $HOME/.kube
          if [ -n "${{ secrets.KUBECONFIG_DEV }}" ]; then
            echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          else
            if [ -z "${{ secrets.KUBECONFIG }}" ]; then
              echo "⚠️ Nem KUBECONFIG_DEV nem KUBECONFIG configurados"
              exit 1
            fi
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config
          kubectl cluster-info

      - name: Criar namespace DEV (idempotente)
        run: |
          kubectl apply -f infra/k8s/namespace-dev.yaml

      - name: ConfigMap mysql-init (DEV)
        run: |
          kubectl create configmap mysql-init -n ${{ env.K8S_NAMESPACE }} \
            --from-file=init.sql=infra/mysql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MySQL DEV (secret, config, pvc, deployment)
        run: |
          kubectl apply -f infra/k8s/mysql-secret-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-configmap-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-pvc-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-deployment-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mysql-dev -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Job criar usuário MySQL DEV (idempotente)
        run: |
          kubectl delete job mysql-create-app-user-dev -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f infra/k8s/mysql-create-user-job-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/mysql-create-app-user-dev -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

      - name: Secret Redis DEV
        run: |
          kubectl apply -f infra/k8s/redis-secret-dev.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Deploy Redis DEV
        run: |
          kubectl apply -f infra/k8s/redis-pvc-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/redis-deployment-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/redis-dev -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Secret API DEV
        run: |
          if [ -n "${{ secrets.LEAD_API_KEY_DEV }}" ]; then
            kubectl create secret generic api-secret-dev -n ${{ env.K8S_NAMESPACE }} \
              --from-literal=api-key="${{ secrets.LEAD_API_KEY_DEV }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            kubectl apply -f infra/k8s/api-secret-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Secret Doc AI DEV
        run: |
          kubectl create secret generic doc-ai-secret-dev -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=DOC_AI_PROVIDER="${{ secrets.DOC_AI_PROVIDER_DEV || '' }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY_DEV || '' }}" \
            --from-literal=OPENAI_MODEL="${{ secrets.OPENAI_MODEL_DEV || 'gpt-4.1-mini' }}" \
            --from-literal=DOC_AI_TIMEOUT_MS="${{ secrets.DOC_AI_TIMEOUT_MS_DEV || '8000' }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY_DEV || '' }}" \
            --from-literal=DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL_DEV || 'deepseek-chat' }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Secret CRM Admin DEV
        run: |
          if [ -n "${{ secrets.ADMIN_USER_DEV }}" ] && [ -n "${{ secrets.ADMIN_PASSWORD_DEV }}" ] && [ -n "${{ secrets.ADMIN_JWT_SECRET_DEV }}" ]; then
            kubectl create secret generic admin-secret-dev -n ${{ env.K8S_NAMESPACE }} \
              --from-literal=admin-user="${{ secrets.ADMIN_USER_DEV }}" \
              --from-literal=admin-password="${{ secrets.ADMIN_PASSWORD_DEV }}" \
              --from-literal=admin-jwt-secret="${{ secrets.ADMIN_JWT_SECRET_DEV }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            kubectl apply -f infra/k8s/admin-secret-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Deploy API DEV
        run: |
          kubectl apply -f infra/k8s/backend-deployment-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-api-dev \
            api=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-api-dev -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Deploy aplicação DEV (frontend)
        run: |
          kubectl apply -f infra/k8s/deployment-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-web-dev \
            web=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web-dev -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Aplicar Middlewares DEV
        run: |
          kubectl apply -f infra/k8s/middlewares/redirect-https-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/middlewares/security-headers-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/middlewares/compress-dev.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Aplicar Certificate e Ingress DEV
        run: |
          kubectl apply -f infra/k8s/certificate-dev.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/ingress-route-dev.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Status final DEV
        run: |
          echo "=== Pods (DEV) ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Deployments (DEV) ==="
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Services (DEV) ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== IngressRoutes (DEV) ==="
          kubectl get ingressroute -n ${{ env.K8S_NAMESPACE }}

  deploy:
    name: Deploy no Kubernetes (PROD)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configurar acesso ao cluster
        run: |
          mkdir -p $HOME/.kube
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "⚠️ Secret KUBECONFIG não configurado. Configure em Settings > Secrets > Actions"
            exit 1
          fi
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl cluster-info || { echo "⚠️ Erro ao conectar ao cluster."; exit 1; }

      - name: Aplicar Namespace
        run: kubectl apply -f infra/k8s/namespace.yaml

      - name: ConfigMap mysql-init (script de criação do banco)
        run: |
          kubectl create configmap mysql-init -n ${{ env.K8S_NAMESPACE }} \
            --from-file=init.sql=infra/mysql/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy MySQL (secret, config, pvc, deployment)
        run: |
          kubectl apply -f infra/k8s/mysql-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/mysql-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/mysql -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Job criar usuário MySQL (idempotente)
        run: |
          kubectl delete job mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --ignore-not-found=true
          kubectl apply -f infra/k8s/mysql-create-user-job.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl wait --for=condition=complete job/mysql-create-app-user -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

      - name: Secret doc-ai (validação de documentos via IA)
        run: |
          kubectl create secret generic doc-ai-secret -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=DOC_AI_PROVIDER="${{ secrets.DOC_AI_PROVIDER || '' }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY || '' }}" \
            --from-literal=OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4.1-mini' }}" \
            --from-literal=DOC_AI_TIMEOUT_MS="${{ secrets.DOC_AI_TIMEOUT_MS || '8000' }}" \
            --from-literal=DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY || '' }}" \
            --from-literal=DEEPSEEK_MODEL="${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}" \
            --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -
          echo "Secret doc-ai-secret criado/atualizado (valores vêm do Environment production: DOC_AI_PROVIDER, OPENAI_API_KEY, etc.). Confira no passo 'Verificar variáveis Doc AI no Pod' se o pod recebeu as variáveis."

      - name: Deploy API (backend)
        run: |
          kubectl apply -f infra/k8s/api-secret.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-api \
            api=${{ env.DOCKER_REGISTRY }}/lpigreen-api:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-api -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Verificar variáveis Doc AI no Pod da API
        run: |
          echo "Verificando se DOC_AI_PROVIDER e OPENAI_API_KEY estão no pod lpigreen-api..."
          POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=lpigreen-api -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "$POD" ]; then
            echo "⚠️ Pod da API ainda não listado (rollout pode estar em andamento)."
            exit 0
          fi
          echo "Pod: $POD"
          kubectl exec -n ${{ env.K8S_NAMESPACE }} "$POD" -- env 2>/dev/null | grep -E '^DOC_AI_PROVIDER=|^OPENAI_API_KEY=' | sed 's/=.*/=*** (valor definido)/' || echo "⚠️ Variáveis Doc AI não encontradas no container."
          echo "✅ Se DOC_AI_PROVIDER e OPENAI_API_KEY aparecerem acima com 'valor definido', a validação de documentos está configurada no pod."

      - name: Secret CRM Admin (login /admin)
        run: |
          if [ -n "${{ secrets.ADMIN_USER }}" ] && [ -n "${{ secrets.ADMIN_PASSWORD }}" ] && [ -n "${{ secrets.ADMIN_JWT_SECRET }}" ]; then
            echo "Criando/atualizando admin-secret a partir dos GitHub Secrets (ADMIN_USER, ADMIN_PASSWORD, ADMIN_JWT_SECRET)."
            kubectl create secret generic admin-secret -n ${{ env.K8S_NAMESPACE }} \
              --from-literal=admin-user="${{ secrets.ADMIN_USER }}" \
              --from-literal=admin-password="${{ secrets.ADMIN_PASSWORD }}" \
              --from-literal=admin-jwt-secret="${{ secrets.ADMIN_JWT_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -n ${{ env.K8S_NAMESPACE }} -f -
            echo "✅ admin-secret atualizado com as credenciais do GitHub."
          else
            echo "⚠️ GitHub Secrets ADMIN_USER, ADMIN_PASSWORD ou ADMIN_JWT_SECRET não configurados."
            echo "Aplicando admin-secret.yaml com valores de exemplo (login não funcionará até configurar os secrets)."
            kubectl apply -f infra/k8s/admin-secret.yaml -n ${{ env.K8S_NAMESPACE }}
            echo "Para o login admin funcionar: em Settings > Secrets and variables > Actions, crie ADMIN_USER, ADMIN_PASSWORD e ADMIN_JWT_SECRET e rode o deploy novamente."
          fi

      - name: Reiniciar frontend para carregar credenciais admin (se secret foi atualizado)
        run: |
          kubectl rollout restart deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} || true
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Deploy aplicação (frontend)
        run: |
          kubectl apply -f infra/k8s/deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl set image deployment/lpigreen-web \
            web=${{ env.DOCKER_REGISTRY }}/lpigreen-web:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/lpigreen-web -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Aplicar Middlewares
        run: |
          if [ -d "infra/k8s/middlewares" ]; then
            kubectl apply -f infra/k8s/middlewares/ -n ${{ env.K8S_NAMESPACE }}
          fi

      - name: Aplicar Certificate e Ingress
        run: |
          kubectl apply -f infra/k8s/certificate.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/k8s/ingress-route.yaml -n ${{ env.K8S_NAMESPACE }}

      - name: Status final
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== IngressRoutes ==="
          kubectl get ingressroute -n ${{ env.K8S_NAMESPACE }}
