# Credenciais do CRM Admin (/admin). Obrigatório para login funcionar em produção.
# Criar/atualizar com valores reais. Exemplo (senha em texto para dev):
#   kubectl create secret generic admin-secret -n lpigreen \
#     --from-literal=admin-user='seu_usuario' \
#     --from-literal=admin-password='sua_senha' \
#     --from-literal=admin-jwt-secret='uma_string_longa_aleatoria_para_jwt' \
#     --dry-run=client -o yaml | kubectl apply -f -
# Para senha em hash bcrypt (recomendado em prod): use admin-password-hash em vez de admin-password.
apiVersion: v1
kind: Secret
metadata:
  name: admin-secret
  namespace: lpigreen
type: Opaque
stringData:
  # Usuário para login no /admin (obrigatório)
  admin-user: "igreenadmin"
  # Senha em texto (troque em produção)
  admin-password: "troque_sua_senha_aqui"
  # Segredo para assinar o JWT da sessão (gere um valor longo e aleatório)
  admin-jwt-secret: "troque_por_uma_string_aleatoria_longa_segura"
