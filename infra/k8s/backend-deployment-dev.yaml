apiVersion: apps/v1
kind: Deployment
metadata:
  name: lpigreen-api-dev
  namespace: lpigreendev
  labels:
    app: lpigreen-api-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lpigreen-api-dev
  template:
    metadata:
      labels:
        app: lpigreen-api-dev
    spec:
      imagePullSecrets:
        - name: lpigreen-registry
      containers:
        - name: api
          image: donavanalencar/lpigreen-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "3001"
            - name: MYSQL_HOST
              value: "mysql-dev"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-config-dev
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              value: "igreen_app"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret-dev
                  key: mysql-app-password
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret-dev
                  key: api-key
            - name: REDIS_HOST
              value: "redis-dev"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret-dev
                  key: redis-password
            - name: REDIS_DB
              value: "0"
            - name: REDIS_TTL_SECONDS
              value: "259200"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: DOC_AI_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: doc-ai-secret-dev
                  key: DOC_AI_PROVIDER
                  optional: true
            - name: DOC_AI_TIMEOUT_MS
              valueFrom:
                secretKeyRef:
                  name: doc-ai-secret-dev
                  key: DOC_AI_TIMEOUT_MS
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: doc-ai-secret-dev
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef:
                  name: doc-ai-secret-dev
                  key: OPENAI_MODEL
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: doc-ai-secret-dev
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: DEEPSEEK_MODEL
              valueFrom:
                secretKeyRef:
                  name: doc-ai-secret-dev
                  key: DEEPSEEK_MODEL
                  optional: true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-dev
  namespace: lpigreendev
  labels:
    app: lpigreen-api-dev
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: lpigreen-api-dev
