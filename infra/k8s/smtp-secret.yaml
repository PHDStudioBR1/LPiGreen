# SMTP para notificação ao representante (Seguros/Telecom).
#
# Crie manualmente no cluster (exemplo):
#   kubectl create secret generic smtp-secret -n lpigreen \
#     --from-literal=notify-enabled='true' \
#     --from-literal=smtp-host='smtp.seudominio.com' \
#     --from-literal=smtp-port='587' \
#     --from-literal=smtp-secure='false' \
#     --from-literal=smtp-user='usuario' \
#     --from-literal=smtp-pass='senha' \
#     --from-literal=mail-from='notificacoes@seudominio.com' \
#     --from-literal=mail-from-name='LPiGreen' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Mesmas chaves em dev e prod; apenas os valores mudam por namespace/secret.
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: lpigreen
type: Opaque
stringData:
  notify-enabled: "false"
  smtp-host: ""
  smtp-port: "587"
  smtp-secure: "false"
  smtp-user: ""
  smtp-pass: ""
  mail-from: ""
  mail-from-name: "LPiGreen"
