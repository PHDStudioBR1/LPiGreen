apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers-dev
  namespace: lpigreen
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
    customResponseHeaders:
      # Meta: connect.facebook.net + eventos avançados (*.on.aws / *.run.app / graph).
      # PostHog: us.i.posthog.com + assets (projeto 522696).
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://*.googletagmanager.com https://connect.facebook.net https://*.i.posthog.com https://us-assets.i.posthog.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://connect.facebook.net https://*.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://*.google-analytics.com https://www.google-analytics.com https://*.googletagmanager.com https://www.googletagmanager.com https://www.facebook.com; font-src 'self' data:; connect-src 'self' https://lpigreendev.546digitalservices.com https://viacep.com.br https://*.google-analytics.com https://www.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://www.google.com https://connect.facebook.net https://www.facebook.com https://*.facebook.com https://*.facebook.net https://graph.facebook.com https://*.on.aws https://*.run.app https://*.posthog.com https://*.i.posthog.com https://us.i.posthog.com https://us-assets.i.posthog.com; frame-src 'self' https://player.vimeo.com https://www.googletagmanager.com; frame-ancestors 'none';"
      X-Frame-Options: "DENY"
      X-Content-Type-Options: "nosniff"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
