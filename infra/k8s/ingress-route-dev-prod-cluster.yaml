# IngressRoute DEV no cluster de produção (lpigreen-web-dev → web-dev-service).
# lpigreendev deve apontar para o mesmo load balancer deste cluster.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-dev-http
  namespace: lpigreen
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/`) && !PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: redirect-https
          namespace: lpigreen
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-dev-https
  namespace: lpigreen
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/leads`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/admin`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/representantes`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/seguros`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/telecom`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/captacao`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api/conexao-green`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: api-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
    - match: Host(`lpigreendev.546digitalservices.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web-dev-service
          port: 80
      middlewares:
        - name: security-headers-dev
          namespace: lpigreen
        - name: compress
          namespace: lpigreen
  tls:
    certResolver: le
    domains:
      - main: lpigreendev.546digitalservices.com
