apiVersion: apps/v1
kind: Deployment
metadata:
  name: lpigreen-web
  namespace: lpigreen
  labels:
    app: lpigreen-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lpigreen-web
  template:
    metadata:
      labels:
        app: lpigreen-web
    spec:
      # Use se o repositório Docker for privado: crie o secret com kubectl create secret docker-registry ...
      imagePullSecrets:
        - name: lpigreen-registry
      containers:
      - name: web
        image: donavanalencar/lpigreen-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: LEAD_API_URL
          value: "http://api-service.phdstudio.svc.cluster.local"
        - name: RANDOM_SERVICE_URL
          value: "http://random-service-api.phdstudio.svc.cluster.local"
        - name: LEAD_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: api-key
        # CRM Admin: login em /admin (obrigatório para o login funcionar)
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: admin-secret
              key: admin-user
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: admin-secret
              key: admin-password
        - name: ADMIN_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: admin-secret
              key: admin-jwt-secret
        # Conexão Green → n8n (proxy em /api/conexao-green/n8n). Crie o Secret opcional ou omita se usar só NEXT_PUBLIC no build.
        - name: N8N_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: n8n-webhook-secret
              key: webhook-url
              optional: true
        # Seguros → PHD CRM. Em DEV, mantenha PHDCRM_ENV=dev; para migrar, troque para prod e configure a senha de produção no Secret.
        - name: PHDCRM_ENV
          value: "prod"
        - name: PHDCRM_TENANT_SLUG
          value: "igreen"
        - name: PHDCRM_DEV_BASE_URL
          value: "https://phdcrmdev.546digitalservices.com"
        - name: PHDCRM_DEV_EMAIL
          value: "admin@igreen"
        - name: PHDCRM_DEV_PASSWORD
          valueFrom:
            secretKeyRef:
              name: phdcrm-secret
              key: dev-password
              optional: true
        - name: PHDCRM_PROD_BASE_URL
          value: "https://phdcrm.546digitalservices.com"
        - name: PHDCRM_PROD_EMAIL
          value: "admin@igreen"
        - name: PHDCRM_PROD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: phdcrm-secret
              key: prod-password
              optional: true
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: lpigreen
  labels:
    app: lpigreen-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: lpigreen-web
