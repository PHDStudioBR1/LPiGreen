apiVersion: apps/v1
kind: Deployment
metadata:
  name: lpigreen-web
  namespace: lpigreen
  labels:
    app: lpigreen-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lpigreen-web
  template:
    metadata:
      labels:
        app: lpigreen-web
    spec:
      containers:
      - name: web
        image: donavanalencar/lpigreen-web:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: lpigreen
  labels:
    app: lpigreen-web
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: lpigreen-web
