apiVersion: apps/v1
kind: Deployment
metadata:
  name: lpigreen-web-dev
  namespace: lpigreendev
  labels:
    app: lpigreen-web-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lpigreen-web-dev
  template:
    metadata:
      labels:
        app: lpigreen-web-dev
    spec:
      imagePullSecrets:
        - name: lpigreen-registry
      containers:
        - name: web
          image: donavanalencar/lpigreen-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: LEAD_API_URL
              value: "http://api-service-dev"
            - name: LEAD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret-dev
                  key: api-key
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: admin-secret-dev
                  key: admin-user
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-secret-dev
                  key: admin-password
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-secret-dev
                  key: admin-jwt-secret
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service-dev
  namespace: lpigreendev
  labels:
    app: lpigreen-web-dev
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: lpigreen-web-dev
