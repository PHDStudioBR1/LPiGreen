# Job único para criar o usuário da aplicação no MySQL (executar após o MySQL estar rodando).
# kubectl apply -f mysql-create-user-job.yaml
# O Job usa o Secret mysql-secret para obter as senhas.
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-create-app-user
  namespace: phdstudio
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-user
          image: mysql:8.0
          command:
            - /bin/sh
            - -c
            - |
              mysql -h mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "
              CREATE USER IF NOT EXISTS 'igreen_app'@'%' IDENTIFIED BY '$MYSQL_APP_PASSWORD';
              GRANT SELECT, INSERT, UPDATE, DELETE ON igreen_captacao.* TO 'igreen_app'@'%';
              FLUSH PRIVILEGES;
              "
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-app-password
