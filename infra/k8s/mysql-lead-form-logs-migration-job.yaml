apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-lead-form-logs-migration
  namespace: lpigreen
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: mysql:8.0
          command:
            - /bin/sh
            - -c
            - |
              mysql -h mysql -u root -p"$MYSQL_ROOT_PASSWORD" -D igreen_captacao -e "
              CREATE TABLE IF NOT EXISTS lead_form_logs (
                id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT,
                session_id VARCHAR(64) DEFAULT NULL,
                event_type VARCHAR(64) NOT NULL,
                step_index TINYINT UNSIGNED DEFAULT NULL,
                step_id VARCHAR(64) DEFAULT NULL,
                payload_json JSON DEFAULT NULL,
                ip_address VARCHAR(64) DEFAULT NULL,
                user_agent VARCHAR(512) DEFAULT NULL,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                PRIMARY KEY (id),
                KEY idx_lead_form_logs_session_created (session_id, created_at),
                KEY idx_lead_form_logs_event_created (event_type, created_at)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
              "
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
