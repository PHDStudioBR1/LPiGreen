# Secret para validação de documentos via IA (OpenAI ou DeepSeek).
# No CI/CD, este secret é criado/atualizado a partir dos GitHub Secrets.
# Para deploy manual: preencha os valores e aplique com kubectl apply -f infra/k8s/doc-ai-secret.yaml -n lpigreen
# Chaves vazias = validação desabilitada (resposta cai em revisão manual).
apiVersion: v1
kind: Secret
metadata:
  name: doc-ai-secret
  namespace: phdstudio
type: Opaque
stringData:
  DOC_AI_PROVIDER: ""
  DOC_AI_TIMEOUT_MS: "8000"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: "gpt-4.1-mini"
  DEEPSEEK_API_KEY: ""
  DEEPSEEK_MODEL: "deepseek-chat"
