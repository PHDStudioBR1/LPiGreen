# IngressRoute HTTP (redireciona para HTTPS, exceto ACME challenge)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-http
  namespace: lpigreen
spec:
  entryPoints:
    - web
  routes:
    # ACME challenge em HTTP para validação Let's Encrypt
    - match: Host(`lpigreen.546digitalservices.com`) && PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: web-service
          port: 80
    # Demais rotas redirecionam para HTTPS
    - match: Host(`lpigreen.546digitalservices.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: redirect-https
          namespace: lpigreen
---
# IngressRoute HTTPS (rotas principais com TLS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-https
  namespace: lpigreen
spec:
  entryPoints:
    - websecure
  routes:
    # Apenas POST /api/leads vai para o frontend (Next.js), que faz proxy com API Key
    - match: Host(`lpigreen.546digitalservices.com`) && PathPrefix(`/api/leads`) && Method(`POST`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    # Demais /api (GET/PATCH/DELETE /api/leads, /api/health, etc.) -> backend
    - match: Host(`lpigreen.546digitalservices.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: api-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    # Frontend (web)
    - match: Host(`lpigreen.546digitalservices.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
        - name: compress
          namespace: lpigreen
  tls:
    certResolver: le
