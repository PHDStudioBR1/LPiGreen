# IngressRoute HTTP (redireciona para HTTPS, exceto ACME challenge)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-http
  namespace: phdcrm-dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/`) && !PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: redirect-https
          namespace: phdcrm-dev
---
# IngressRoute HTTPS (rotas principais com TLS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-https
  namespace: phdcrm-dev
spec:
  entryPoints:
    - websecure
  routes:
    # /api/leads -> frontend (Next.js)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/leads`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: phdcrm-dev
    # CRM Admin -> frontend (Next.js)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/admin`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: phdcrm-dev
    # /api/representantes -> frontend (Next.js)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/representantes`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: phdcrm-dev
    # /api/seguros -> frontend (Next.js)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/seguros`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: phdcrm-dev
    # Demais /api -> backend (api-dev-service)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: api-dev-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: phdcrm-dev
    # Frontend (web)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: phdcrm-dev
        - name: compress
          namespace: phdcrm-dev
  tls:
    certResolver: le
    domains:
      - main: lpigreen-dev.546digitalservices.com
