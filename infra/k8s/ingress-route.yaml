# IngressRoute HTTP (redireciona para HTTPS, exceto ACME challenge)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-http
  namespace: lpigreen
spec:
  entryPoints:
    - web
  routes:
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/`) && !PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: redirect-https
          namespace: lpigreen
---
# IngressRoute HTTPS (rotas principais com TLS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-https
  namespace: lpigreen
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/leads`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/admin`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/representantes`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/seguros`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/telecom`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/captacao`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api/conexao-green`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: api-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: (Host(`lpigreen.546digitalservices.com`) || Host(`centraldobeneficioenergia.com.br`) || Host(`representanteigreen.com.br`)) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
        - name: compress
          namespace: lpigreen
  tls:
    certResolver: le
    domains:
      - main: lpigreen.546digitalservices.com
      - main: centraldobeneficioenergia.com.br
      - main: representanteigreen.com.br
