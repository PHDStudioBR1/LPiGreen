# IngressRoute HTTP (redireciona para HTTPS, exceto ACME challenge)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-http
  namespace: lpigreen
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/`) && !PathPrefix(`/.well-known/acme-challenge`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: redirect-https
          namespace: lpigreen
---
# IngressRoute HTTPS (rotas principais com TLS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lpigreen-https
  namespace: lpigreen
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/leads`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/admin`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/representantes`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api/seguros`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    # Demais /api -> backend local do LPiGreen (api-service no namespace lpigreen)
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: api-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
    - match: Host(`lpigreen-dev.546digitalservices.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web-service
          port: 80
      middlewares:
        - name: security-headers
          namespace: lpigreen
        - name: compress
          namespace: lpigreen
  tls:
    certResolver: le
    domains:
      - main: lpigreen-dev.546digitalservices.com
