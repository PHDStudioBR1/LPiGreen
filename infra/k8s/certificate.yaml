# Certificate para lpigreen.546digitalservices.com
# Gerenciado automaticamente pelo cert-manager (Let's Encrypt)
# Requer ClusterIssuer letsencrypt-prod no cluster (ex.: infra do phd-crm)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lpigreen-tls
  namespace: lpigreen
spec:
  secretName: lpigreen-546digitalservices-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - lpigreen.546digitalservices.com
  commonName: lpigreen.546digitalservices.com
